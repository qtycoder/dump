<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Admin setup · Busride</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="inner">
  <div id="bg" aria-hidden="true"></div>
  <div class="scroller">
    <main class="page" style="max-width:460px;margin-top:8vh">
      <div class="gcard liquid">
        <p class="k">Busride_</p>
        <h1 style="font-size:26px;margin:6px 0 4px">Create the admin account</h1>
        <p class="lead" id="note">This works only once, from this computer, while there is no admin yet.</p>
        <form id="f" novalidate style="margin-top:16px" hidden>
          <div class="fg"><label class="lbl" for="n">Full name</label><input class="inp" id="n" autocomplete="name" maxlength="60"></div>
          <div class="fg"><label class="lbl" for="e">Email</label><input class="inp" id="e" type="email" autocomplete="email"></div>
          <div class="fg"><label class="lbl" for="p">Password (8+ characters)</label><input class="inp" id="p" type="password" autocomplete="new-password"></div>
          <div class="fg"><label class="lbl" for="c">Confirm password</label><input class="inp" id="c" type="password" autocomplete="new-password"></div>
          <button class="btn block" id="go" type="submit">Create admin &amp; open dashboard</button>
          <p class="msg-line" id="m" role="alert"></p>
        </form>
        <div class="btn-row"><a class="btn ghost sm" href="index.html">Back to home</a></div>
      </div>
    </main>
  </div>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/setup.js"></script>
</body>
</html>
