<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trips · Busride</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="inner">
  <div id="bg" aria-hidden="true"></div>
  <div class="scroller">
    <header id="topnav"></header>

    <main class="page">
      <section>
        <h1>Choose your trip</h1>
        <p class="lead">Pick a route and a departure. You will see the bus, the map, the fare for every passenger type and who is driving, so you know you are riding safe.</p>
      </section>

      <section class="split">
        <div class="gcard">
          <div class="fg">
            <label class="lbl" for="fromSel">From</label>
            <select class="inp" id="fromSel"><option value="">Anywhere</option></select>
          </div>
          <div class="fg">
            <label class="lbl" for="toSel">To (destination)</label>
            <select class="inp" id="toSel"><option value="">Any destination</option></select>
          </div>
          <div class="fg">
            <label class="lbl" for="dateInp">Date</label>
            <input class="inp" id="dateInp" type="date">
          </div>
          <div id="tripList" class="trip-list" aria-live="polite"><p class="empty">Loading…</p></div>
        </div>

        <div id="detail" class="gcard"><p class="empty">Select a trip to see the details.</p></div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/trips.js"></script>
</body>
</html>
